<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mike Sopper's Grips Pro Shop</title><style>
:root{--b:#153b63;--r:#c51f2a;--bg:#f4f6f8;--line:#d9e1e7;--muted:#66737e}*{box-sizing:border-box}body{margin:0;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#1e2933}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;min-height:48px;font-weight:800}.pri{background:var(--b);color:#fff;padding:0 18px}.sec{background:#edf2f5;padding:0 16px}.wrap{max-width:1050px;margin:28px auto;padding:0 16px}header{background:#fff;border-bottom:1px solid var(--line);padding:10px max(16px,calc((100% - 1050px)/2));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.logo{height:46px;max-width:230px}.logoHome{background:none;padding:0;min-height:auto;display:flex;align-items:center}.logoutLink{background:none;color:var(--b);padding:6px 2px;min-height:auto;text-decoration:underline;font-weight:800}.small{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 6px 20px #0000000d}.loginShell{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(500px,100%)}.login img{display:block;width:min(300px,80%);margin:0 auto}.tag{text-align:center;color:var(--b);font-weight:900;font-size:20px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-weight:700}.field input,.field select,.field textarea,.search{width:100%;padding:13px;border:1px solid #b9c5ce;border-radius:10px}.field textarea{min-height:90px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{width:100%;background:#fff;border-radius:0;border-bottom:1px solid #e8edf0;padding:15px 17px;text-align:left;display:flex;justify-content:space-between}.row:last-child{border-bottom:0}.row span{display:block;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f8fafb;border:1px solid #e6ecef;border-radius:10px;padding:10px}.metric small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.actions,.formActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.profileActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.back{background:none;color:var(--b);padding:0}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.three{grid-template-columns:repeat(3,1fr)}.purchase{border-top:1px solid #e7ebee;padding:11px 0}.purchase:first-child{border-top:0}.line{display:flex;justify-content:space-between;gap:10px}.purchaseItem{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;margin-top:8px}.ballThumb{width:50px;height:50px;object-fit:contain;border:1px solid #e3e8ec;border-radius:9px;background:#fff;padding:3px}.note{background:#fff8e6;border:1px solid #ead9a7;border-radius:10px;padding:11px;margin:12px 0}.ok{color:#237a4b;font-weight:800}.items .item{display:grid;grid-template-columns:1fr 140px 48px;gap:8px;align-items:end}.remove{background:#f7eded;color:#9d2d2d}.total{display:flex;justify-content:space-between;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:12px}.hint{text-align:center;color:var(--muted);font-size:12px}.reset{background:none;color:var(--b);min-height:34px}@media(max-width:900px){}@media(max-width:720px){.grid{grid-template-columns:1fr}.formGrid,.three{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.shop{display:none}.profileActions{width:100%}.profileActions button{flex:1}}@media(max-width:520px){.toolbar{grid-template-columns:1fr}.formGrid,.three{grid-template-columns:1fr}.items .item{grid-template-columns:1fr 105px 48px}}
</style></head><body><div id="app"></div><script>
const KEY='grips-demo-v2',clone=x=>JSON.parse(JSON.stringify(x)),today=()=>new Date().toISOString().slice(0,10),money=n=>'$'+Number(n||0).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),fmt=d=>{if(!d)return'';let[a,b,c]=d.split('-').map(Number);return new Date(a,b-1,c).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})},uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const seed=[
{id:'1',name:'John Smith',phone:'630-555-1212',email:'john@example.com',notes:'Prefers a slightly snug thumb fit.',measurements:[{date:'2026-09-19',hand:'Right',grip:'Fingertip',middleSpan:'4 1/2',ringSpan:'4 9/16',thumb:'1 1/16',middleHole:'31/32',ringHole:'15/16',inserts:'Medium oval',mFB:'1/4 reverse',mLR:'1/8 left',rFB:'1/4 reverse',rLR:'1/8 right',tFB:'1/8 forward',tLR:'0',notes:'Comfort fit; slightly snug thumb.'}],purchases:[{date:'2026-09-19',items:[{d:'Storm Phaze II, 15 lb',p:179.95},{d:'Drill & Plug',p:50}],total:229.95}]},
{id:'2',name:'Susan Brown',phone:'630-555-0184',email:'',notes:'',measurements:[{date:'2026-08-28',hand:'Right',grip:'Fingertip',middleSpan:'4 3/8',ringSpan:'4 7/16',thumb:'1',middleHole:'15/16',ringHole:'15/16',inserts:'Small lifts',mFB:'1/8 reverse',mLR:'0',rFB:'1/8 reverse',rLR:'0',tFB:'0',tLR:'1/16 right',notes:''}],purchases:[{date:'2026-08-28',items:[{d:'Hammer Black Widow 3.0, 14 lb',p:189.95},{d:'Drilling',p:30}],total:219.95}]},
{id:'3',name:'Mike Jones',phone:'331-555-0142',email:'',notes:'',measurements:[],purchases:[]},
{id:'4',name:'Karen Wilson',phone:'630-555-0136',email:'karen@example.com',notes:'New customer.',measurements:[],purchases:[]}
];
const BALL_IMAGES={
  'storm phaze ii':'https://stormproducts.nyc3.cdn.digitaloceanspaces.com/product_pages/Balls/Storm/Phaze_II/PHAZE%20II_00000.png',
  'hammer black widow 3.0':'https://cdn-images.bowling.com/productimages/hammer-black-widow-3-0-solid-bowling-ball-24015.jpg?class=medium'
};
function ballImage(desc){
  const d=String(desc||'').toLowerCase();
  if(d.includes('storm phaze ii'))return BALL_IMAGES['storm phaze ii'];
  if(d.includes('hammer black widow 3.0'))return BALL_IMAGES['hammer black widow 3.0'];
  return '';
}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:clone(seed)}catch{return clone(seed)}}let S={login:false,view:'customers',customers:load(),id:null,q:'',msg:''};const app=document.getElementById('app');const save=()=>localStorage.setItem(KEY,JSON.stringify(S.customers)),sel=()=>S.customers.find(x=>x.id===S.id),cur=c=>(c.measurements||[]).slice().sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
function shell(x){return '<header><button class="logoHome" data-a="logout" title="Back to login"><img class="logo" src="https://www.msgrips.com/images/MSGrips_Logo.png" alt="Mike Sopper\'s Grips Pro Shop"></button><div style="display:flex;align-items:center;gap:14px"><div class="shop">Customer & Drilling Records<div class="small">Get a GRIP on your game</div></div><button class="logoutLink" data-a="logout">Log off</button></div></header><main class="wrap">'+x+'</main>'}
function render(){if(!S.login){app.innerHTML='<div class="loginShell"><section class="card login"><img src="https://www.msgrips.com/images/MSGrips_Logo.png"><p class="tag">Get a GRIP on your game</p><p class="small" style="text-align:center">Customer & Drilling Records</p><div class="note"><b>Demo version</b><br>Anything you add is saved on this device.</div><label class="field">Email<input value="demo@proshop.com"></label><label class="field">Password<input type="password" value="demo1234"></label><button class="pri" style="width:100%" id="go">OPEN SHOP RECORDS</button></section></div>';document.getElementById('go').onclick=()=>{S.login=true;render()};return}let x='';if(S.view==='customers')x=customers();if(S.view==='new')x=newCust();if(S.view==='edit')x=editCust();if(S.view==='profile')x=profile();if(S.view==='measure')x=measure();if(S.view==='purchase')x=purchase();app.innerHTML=shell(x);wire()}
function customers(){let q=S.q.toLowerCase(),rows=S.customers.filter(c=>(c.name+' '+c.phone+' '+c.email).toLowerCase().includes(q));return '<h1>Customers</h1><p class="small">Find a bowler in seconds by name or phone number.</p><div class="toolbar"><input id="search" class="search" placeholder="Search name or phone..." value="'+esc(S.q)+'"><button class="pri" data-a="new">+ NEW CUSTOMER</button></div><section class="list">'+(rows.length?rows.map(c=>{let m=cur(c);return '<button class="row" data-open="'+c.id+'"><div><b>'+esc(c.name)+'</b><span>'+esc(c.phone||'No phone')+'</span></div><div><span>'+(m?'Measured '+fmt(m.date):'No measurements')+'</span></div></button>'}).join(''):'<div style="padding:25px;text-align:center">No customers found.</div>')+'</section><p class="hint"><button class="reset" data-a="reset">Reset demo data</button></p>'}
function newCust(){return '<button class="back" data-a="customers">← Customers</button><section class="card"><h1>New Customer</h1><form id="cf"><div class="formGrid"><label class="field">Name<input name="name" required></label><label class="field">Phone<input name="phone"></label><label class="field">Email<input name="email" type="email"></label></div><label class="field">Notes<textarea name="notes"></textarea></label><div class="formActions"><button type="button" class="sec" data-a="customers">Cancel</button><button class="pri">SAVE CUSTOMER</button></div></form></section>'}
function editCust(){let c=sel();if(!c){S.view='customers';return customers()}return '<button class="back" data-a="profile">← '+esc(c.name)+'</button><section class="card"><h1>Edit Customer Info</h1><p class="small">Update name, phone, email, or notes.</p><form id="ef"><div class="formGrid"><label class="field">Name<input name="name" required value="'+esc(c.name)+'"></label><label class="field">Phone<input name="phone" value="'+esc(c.phone||'')+'"></label><label class="field">Email<input name="email" type="email" value="'+esc(c.email||'')+'"></label></div><label class="field">Notes<textarea name="notes">'+esc(c.notes||'')+'</textarea></label><div class="formActions"><button type="button" class="sec" data-a="profile">Cancel</button><button class="pri">SAVE CHANGES</button></div></form></section>'}
function profile(){let c=sel();if(!c){S.view='customers';return customers()}let m=cur(c),ps=(c.purchases||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));return '<button class="back" data-a="customers">← Customers</button><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h1>'+esc(c.name)+'</h1><p class="small">'+esc(c.phone||'No phone')+(c.email?' · '+esc(c.email):'')+'</p></div><div class="profileActions"><button class="sec" data-a="edit">EDIT CUSTOMER INFO</button><button class="pri" data-a="purchase">+ NEW PURCHASE</button></div></div>'+(S.msg?'<p class="ok">✓ '+esc(S.msg)+'</p>':'')+'<div class="grid"><section class="card"><h2>Current Measurements</h2><p class="small">'+(m?'Measured '+fmt(m.date)+' · older records are preserved':'No measurements entered yet')+'</p>'+(m?'<div class="metrics"><div class="metric"><small>Middle span</small><b>'+esc(m.middleSpan||'—')+'</b></div><div class="metric"><small>Ring span</small><b>'+esc(m.ringSpan||'—')+'</b></div><div class="metric"><small>Thumb</small><b>'+esc(m.thumb||'—')+'</b></div><div class="metric"><small>Hand</small><b>'+esc(m.hand||'—')+'</b></div><div class="metric"><small>Grip</small><b>'+esc(m.grip||'—')+'</b></div><div class="metric"><small>Inserts</small><b>'+esc(m.inserts||'—')+'</b></div></div><div class="note"><b>Pitches</b><br>Middle: '+esc(m.mFB||'—')+' / '+esc(m.mLR||'—')+'<br>Ring: '+esc(m.rFB||'—')+' / '+esc(m.rLR||'—')+'<br>Thumb: '+esc(m.tFB||'—')+' / '+esc(m.tLR||'—')+'</div>':'<p>No measurements recorded.</p>')+'<div class="actions"><button class="sec" data-a="measure">'+(m?'UPDATE':'ADD')+' MEASUREMENTS</button></div></section><section class="card"><h2>Purchase History</h2>'+(ps.length?ps.map(p=>'<div class="purchase"><div class="line"><b>'+fmt(p.date)+'</b><b>'+money(p.total)+'</b></div>'+p.items.map(i=>{let bi=ballImage(i.d);return '<div class="purchaseItem">'+(bi?'<img class="ballThumb" src="'+bi+'" alt="">':'<div></div>')+'<span>'+esc(i.d)+'</span><span>'+money(i.p)+'</span></div>'}).join('')+'</div>').join(''):'<p>No purchases recorded yet.</p>')+'</section></div>'+(c.notes?'<section class="card" style="margin-top:16px"><h2>Customer Notes</h2><p>'+esc(c.notes)+'</p></section>':'')}
function measure(){let c=sel(),m=cur(c)||{};return '<button class="back" data-a="profile">← '+esc(c.name)+'</button><section class="card"><h1>'+(cur(c)?'Update':'Add')+' Measurements</h1><p class="small">Saving creates a new record so older specs remain available.</p><form id="mf"><div class="formGrid three"><label class="field">Date<input name="date" type="date" value="'+today()+'" required></label><label class="field">Hand<select name="hand"><option '+(m.hand==='Right'?'selected':'')+'>Right</option><option '+(m.hand==='Left'?'selected':'')+'>Left</option></select></label><label class="field">Grip<select name="grip"><option '+(m.grip==='Fingertip'?'selected':'')+'>Fingertip</option><option '+(m.grip==='Conventional'?'selected':'')+'>Conventional</option><option '+(m.grip==='Semi-fingertip'?'selected':'')+'>Semi-fingertip</option></select></label></div><h3>Spans & Hole Sizes</h3><div class="formGrid three"><label class="field">Middle span<input name="middleSpan" value="'+esc(m.middleSpan||'')+'"></label><label class="field">Ring span<input name="ringSpan" value="'+esc(m.ringSpan||'')+'"></label><label class="field">Thumb size<input name="thumb" value="'+esc(m.thumb||'')+'"></label><label class="field">Middle hole<input name="middleHole" value="'+esc(m.middleHole||'')+'"></label><label class="field">Ring hole<input name="ringHole" value="'+esc(m.ringHole||'')+'"></label><label class="field">Inserts / grips<input name="inserts" value="'+esc(m.inserts||'')+'"></label></div><h3>Pitches</h3><div class="formGrid"><label class="field">Middle forward/reverse<input name="mFB" value="'+esc(m.mFB||'')+'"></label><label class="field">Middle left/right<input name="mLR" value="'+esc(m.mLR||'')+'"></label><label class="field">Ring forward/reverse<input name="rFB" value="'+esc(m.rFB||'')+'"></label><label class="field">Ring left/right<input name="rLR" value="'+esc(m.rLR||'')+'"></label><label class="field">Thumb forward/reverse<input name="tFB" value="'+esc(m.tFB||'')+'"></label><label class="field">Thumb left/right<input name="tLR" value="'+esc(m.tLR||'')+'"></label></div><label class="field">Notes<textarea name="notes">'+esc(m.notes||'')+'</textarea></label><div class="formActions"><button type="button" class="sec" data-a="profile">Cancel</button><button class="pri">SAVE MEASUREMENTS</button></div></form></section>'}
function purchase(){let c=sel();return '<button class="back" data-a="profile">← '+esc(c.name)+'</button><section class="card"><h1>New Purchase</h1><form id="pf"><label class="field">Purchase date<input name="date" type="date" value="'+today()+'" required></label><div class="items" id="items"><div class="item"><label class="field">Description<input name="desc" placeholder="e.g. Storm Ion Pro, 15 lb" required></label><label class="field">Price<input name="price" type="number" min="0" step=".01" value="0"></label><button type="button" class="remove">×</button></div></div><button type="button" class="sec" id="add">+ ADD ITEM</button><div class="total"><span>Total</span><b id="tot">$0.00</b></div><div class="formActions"><button type="button" class="sec" data-a="profile">Cancel</button><button class="pri">SAVE PURCHASE</button></div></form></section>'}
function wire(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.id=b.dataset.open;S.view='profile';S.msg='';render()});let s=document.getElementById('search');if(s)s.oninput=e=>{S.q=e.target.value;render();setTimeout(()=>{let z=document.getElementById('search');if(z){z.focus();z.setSelectionRange(z.value.length,z.value.length)}},0)};let ef=document.getElementById('ef');if(ef)ef.onsubmit=e=>{e.preventDefault();let f=new FormData(ef),c=sel();c.name=f.get('name').trim();c.phone=f.get('phone').trim();c.email=f.get('email').trim();c.notes=f.get('notes').trim();save();S.view='profile';S.msg='Customer info updated';render()};let cf=document.getElementById('cf');if(cf)cf.onsubmit=e=>{e.preventDefault();let f=new FormData(cf),c={id:uid('c'),name:f.get('name').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),notes:f.get('notes').trim(),measurements:[],purchases:[]};S.customers.unshift(c);save();S.id=c.id;S.view='profile';S.msg='Customer saved';render()};let mf=document.getElementById('mf');if(mf)mf.onsubmit=e=>{e.preventDefault();let f=new FormData(mf),c=sel(),m={date:f.get('date'),hand:f.get('hand'),grip:f.get('grip'),middleSpan:f.get('middleSpan').trim(),ringSpan:f.get('ringSpan').trim(),thumb:f.get('thumb').trim(),middleHole:f.get('middleHole').trim(),ringHole:f.get('ringHole').trim(),inserts:f.get('inserts').trim(),mFB:f.get('mFB').trim(),mLR:f.get('mLR').trim(),rFB:f.get('rFB').trim(),rLR:f.get('rLR').trim(),tFB:f.get('tFB').trim(),tLR:f.get('tLR').trim(),notes:f.get('notes').trim()};c.measurements.push(m);save();S.view='profile';S.msg='Measurements saved';render()};let pf=document.getElementById('pf');if(pf){pf.onsubmit=e=>{e.preventDefault();let ds=[...pf.querySelectorAll('[name=desc]')],ps=[...pf.querySelectorAll('[name=price]')],items=[];ds.forEach((d,i)=>{if(d.value.trim())items.push({d:d.value.trim(),p:parseFloat(ps[i].value)||0})});if(!items.length)return alert('Add at least one item.');let p={date:new FormData(pf).get('date'),items,total:items.reduce((s,i)=>s+i.p,0)};sel().purchases.push(p);save();S.view='profile';S.msg='Purchase saved';render()};document.getElementById('add').onclick=()=>{let d=document.createElement('div');d.className='item';d.innerHTML='<label class="field">Description<input name="desc"></label><label class="field">Price<input name="price" type="number" min="0" step=".01" value="0"></label><button type="button" class="remove">×</button>';document.getElementById('items').appendChild(d);d.querySelector('.remove').onclick=rm;tot()};pf.addEventListener('input',tot);pf.querySelectorAll('.remove').forEach(b=>b.onclick=rm);tot()}}
function rm(e){let rows=document.querySelectorAll('.item');if(rows.length===1){rows[0].querySelector('[name=desc]').value='';rows[0].querySelector('[name=price]').value=0}else e.currentTarget.closest('.item').remove();tot()}function tot(){let t=[...document.querySelectorAll('[name=price]')].reduce((s,x)=>s+(parseFloat(x.value)||0),0),e=document.getElementById('tot');if(e)e.textContent=money(t)}
function act(a){if(a==='logout'){S.login=false;S.view='customers';S.id=null;S.msg='';render();return}if(a==='customers'){S.view='customers';S.id=null;S.msg=''}if(a==='new')S.view='new';if(a==='edit')S.view='edit';if(a==='profile'){S.view='profile';S.msg=''}if(a==='measure')S.view='measure';if(a==='purchase')S.view='purchase';if(a==='reset'&&confirm('Reset all demo data on this device?')){S.customers=clone(seed);save();S.q=''}render()}render();
</script></body></html>
