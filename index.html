<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mike Sopper's Grips Pro Shop | Customer & Drilling Records</title>
<style>
:root{--blue:#153b63;--blue2:#0d2d4d;--ink:#1e2933;--muted:#66737e;--line:#d9e1e7;--bg:#f4f6f8;--green:#237a4b;--accent:#c51f2a}
*{box-sizing:border-box}body{margin:0;font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit}button{border:0;border-radius:12px;min-height:50px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:#fff;padding:0 20px}.secondary{background:#edf2f5;color:var(--ink);padding:0 16px}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1000px)/2));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px}.brand-logo{height:44px;width:auto;display:block}.brand-word{letter-spacing:.08em}.brand-word strong{color:var(--accent)}.shop{color:var(--muted);font-size:14px;text-align:right}.shop small{display:block;font-size:11px;margin-top:2px}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(30,50,70,.05)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#eef2f5,#ffffff)}.login{width:min(500px,100%)}.logo{text-align:center;margin-bottom:12px}.login-logo{max-width:280px;width:78%;height:auto;display:block;margin:0 auto}.grips-title{text-align:center;font-size:34px;line-height:1.05;margin-bottom:8px}.grips-title .grip{color:var(--accent);letter-spacing:.08em}.tagline{text-align:center;font-size:18px;font-weight:800;color:var(--blue);margin-bottom:18px}.contact-card{background:#f7f9fb;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:14px}
h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.note{background:#fff8e6;border:1px solid #ead9a7;border-radius:12px;padding:12px;margin:16px 0}
.field{display:block;font-weight:700;margin:12px 0}.field input{width:100%;padding:14px;border:1px solid #b9c5ce;border-radius:11px;margin-top:6px}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;margin:18px 0}.search{width:100%;min-height:56px;border:1px solid #b9c5ce;border-radius:11px;padding:0 14px;font-size:18px}
.list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.row{width:100%;background:#fff;border-radius:0;border-bottom:1px solid #e8edf0;text-align:left;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.row:last-child{border-bottom:0}.row span{display:block;color:var(--muted);font-weight:500;font-size:14px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#f8fafb;border:1px solid #e6ecef;border-radius:12px;padding:12px}.metric small{display:block;color:var(--muted);text-transform:uppercase;font-size:11px;font-weight:800}.metric b{display:block;margin-top:4px}.purchase{border-top:1px solid #e7ebee;padding:13px 0}.purchase:first-child{border-top:0}.purchase-line{display:flex;justify-content:space-between;gap:10px}.back{background:none;color:var(--blue);padding:0;min-height:38px}.pill{display:inline-block;background:#edf7f1;color:var(--green);font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.demo-guide{background:#fff;border:1px solid #cfe1ef;border-left:5px solid var(--blue);border-radius:14px;padding:14px;margin:16px 0}
@media(max-width:720px){.grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.top{flex-direction:column}.top .primary{width:100%}.shop{display:none}}
@media(max-width:520px){.toolbar{grid-template-columns:1fr}.toolbar .primary{width:100%}}
</style>
</head>
<body><div id="app"></div>
<script>
const customers=[
{name:"John Smith",phone:"630-555-1212",email:"john@example.com",measured:"Sep 19, 2026",notes:"Prefers a slightly snug thumb fit.",measure:{hand:"Right",grip:"Fingertip",middle:"4 1/2",ring:"4 9/16",thumb:"1 1/16",inserts:"Medium oval",pitches:"Middle: 1/4 reverse / 1/8 left · Ring: 1/4 reverse / 1/8 right · Thumb: 1/8 forward / 0"},purchases:[{date:"Sep 19, 2026",total:"$229.95",items:[["Storm Phaze II, 15 lb","$179.95"],["Drill & Plug","$50.00"]]}]},
{name:"Susan Brown",phone:"630-555-0184",email:"",measured:"Aug 28, 2026",measure:{hand:"Right",grip:"Fingertip",middle:"4 3/8",ring:"4 7/16",thumb:"1",inserts:"Small lifts",pitches:"Middle: 1/8 reverse / 0 · Ring: 1/8 reverse / 0 · Thumb: 0 / 1/16 right"},purchases:[{date:"Aug 28, 2026",total:"$219.95",items:[["Hammer Black Widow 3.0, 14 lb","$189.95"],["Drilling","$30.00"]]}]},
{name:"Mike Jones",phone:"331-555-0142",email:"",measured:"Jul 12, 2026",measure:{hand:"Left",grip:"Conventional",middle:"4 5/8",ring:"4 5/8",thumb:"1 1/8",inserts:"None",pitches:"Thumb: 1/8 reverse / 0"},purchases:[]},
{name:"Karen Wilson",phone:"630-555-0136",email:"karen@example.com",measured:"Not entered",measure:null,purchases:[]}
];
let logged=false,selected=null,q="";
const app=document.getElementById("app");
function shell(x){return '<header><div class="brand"><img class="brand-logo" src="https://www.msgrips.com/images/MSGrips_Logo.png" alt="Mike Sopper\'s Grips Pro Shop logo"></div><div class="shop">Customer & Drilling Records<small>Get a GRIP on your game</small></div></header><main class="wrap">'+x+'</main>'}
function render(){
if(!logged){app.innerHTML='<div class="login-shell"><section class="card login"><div class="logo"><img class="login-logo" src="https://www.msgrips.com/images/MSGrips_Logo.png" alt="Mike Sopper\'s Grips Pro Shop logo"></div><div class="tagline">Get a GRIP on your game</div><p class="muted" style="text-align:center">Customer & Drilling Records</p><div class="contact-card"><b>Funway Entertainment Center</b><br>1335 S. River St (Rt. 25), Batavia, IL 60510<br>630.879.8730<br><span class="muted">Wed/Thu 2–7 · Fri 9–1:30 · Sat 10:30–1:30</span></div><div class="note"><b>Demo</b><br>Working prototype with sample customers. No setup needed.</div><label class="field">Email<input value="demo@proshop.com"></label><label class="field">Password<input type="password" value="demo1234"></label><button class="primary" style="width:100%" onclick="logged=true;render()">OPEN SHOP RECORDS</button><p class="muted" style="text-align:center;margin-top:14px;font-size:13px">Prototype only · sample data</p></section></div>';return}
if(selected!==null){renderProfile();return}
const rows=customers.filter(c=>(c.name+" "+c.phone).toLowerCase().includes(q.toLowerCase()));
app.innerHTML=shell('<div class="top"><div><h1>Customers</h1><p class="muted">Find a bowler in seconds by name or phone number.</p></div><span class="pill">'+customers.length+' demo customers</span></div><div class="demo-guide"><b>Easy demo path:</b> search for <b>John Smith</b>, open his record, review measurements and purchase history.</div><div class="toolbar"><input class="search" id="search" placeholder="Search name or phone..." value="'+q.replace(/"/g,'&quot;')+'"><button class="primary" onclick="alert(\'New customer form is included in the full prototype.\')">+ NEW CUSTOMER</button></div><div class="list">'+rows.map((c,i)=>'<button class="row" onclick="selected='+customers.indexOf(c)+';render()"><div><b>'+c.name+'</b><span>'+c.phone+'</span></div><div><span>Measured '+c.measured+'</span></div></button>').join('')+'</div>');
const s=document.getElementById("search");s.oninput=e=>{q=e.target.value;render();setTimeout(()=>{const x=document.getElementById("search");x.focus();x.setSelectionRange(x.value.length,x.value.length)},0)}
}
function renderProfile(){const c=customers[selected],m=c.measure;
app.innerHTML=shell('<button class="back" onclick="selected=null;render()">← Customers</button><div class="top"><div><h1>'+c.name+'</h1><p class="muted">'+c.phone+(c.email?' · '+c.email:'')+'</p></div><button class="primary" onclick="alert(\'Purchase-entry workflow is in the full prototype.\')">+ NEW PURCHASE</button></div><div class="grid"><section class="card"><h2>Current Measurements</h2><p class="muted">'+(m?'Measured '+c.measured+' · older records are preserved':'No measurements yet')+'</p>'+(m?'<div class="metric-grid"><div class="metric"><small>Middle span</small><b>'+m.middle+'</b></div><div class="metric"><small>Ring span</small><b>'+m.ring+'</b></div><div class="metric"><small>Thumb size</small><b>'+m.thumb+'</b></div><div class="metric"><small>Hand</small><b>'+m.hand+'</b></div><div class="metric"><small>Grip</small><b>'+m.grip+'</b></div><div class="metric"><small>Inserts</small><b>'+m.inserts+'</b></div></div><div class="note"><b>Pitches</b><br>'+m.pitches+'</div>':'<p>No measurements recorded.</p>')+'<div class="actions"><button class="secondary" onclick="alert(\'Measurement-entry form is in the full prototype.\')">'+(m?'UPDATE':'ADD')+' MEASUREMENTS</button></div></section><section class="card"><h2>Purchase History</h2>'+(c.purchases.length?c.purchases.map(p=>'<div class="purchase"><div class="purchase-line"><b>'+p.date+'</b><b>'+p.total+'</b></div>'+p.items.map(i=>'<div class="purchase-line"><span>'+i[0]+'</span><span>'+i[1]+'</span></div>').join('')+'</div>').join(''):'<p class="muted">No purchases recorded yet.</p>')+'</section></div>'+(c.notes?'<section class="card" style="margin-top:18px"><h2>Customer Notes</h2><p>'+c.notes+'</p></section>':''));
}
render();
</script></body></html>
